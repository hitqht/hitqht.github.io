# year        立项/展示年份
# source_zh   资助来源中文，如「国家自然科学基金面上项目」
# source_en   资助来源英文
# title_zh    课题名称中文（页面会自动加书名号）
# title_en    课题名称英文
# amount_zh   本人/本校科研经费中文，如「390 万」
# amount_en   本人/本校科研经费英文，如 CNY 3.90M
# total_zh    项目总经费中文（可选，联合项目时用）
