# ---------- 协作工程师 ----------
- id: li-mingchun
  group: engineer
  name_zh: 李明春
  name_en: Li Mingchun
  role_zh: 系统与软件研发工程师
  role_en: Systems and Software Engineer
  photo: li-mingchun.jpg
  github: https://github.com/MrLeeMC
  bio_zh: 课题组系统与软件研发工程师，负责智能建造相关系统研究、软件架构设计、纵横向课题，以及智能化系统、产品与 AI 软件的软硬件工程应用开发。
  bio_en: Systems and software engineer for the lab. Leads research and architecture for intelligent-construction systems, vertical and industry projects, and engineering of intelligent products, AI software, and hardware–software applications.
  works_zh:
    - 工程质量智能检测机器人
    - 现场安全智能巡检机器人
    - 建筑机器人技术咨询
    - 智能建造应用咨询
    - 科研成果转化
    - 智能化软硬件系统集成
  works_en:
    - Intelligent robots for construction-quality inspection
    - On-site safety inspection robots
    - Construction-robotics consulting
    - Intelligent-construction application consulting
    - Research-to-product transfer
    - Intelligent hardware–software system integration

