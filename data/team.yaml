- id: zhang-duo
  group: engineer
  name_zh: 张铎
  name_en: Zhang Duo
  role_zh: 机械设计工程师
  role_en: Mechanical Design Engineer
  photo: zhang-duo.jpg
  bio_zh: 课题组机械设计工程师，负责智能建造装备本体结构研究、机械方案设计，以及建筑机器人与智能化装备样机的机械结构工程开发。
  bio_en: Mechanical design engineer for the lab. Works on structural research and mechanical schemes for intelligent-construction equipment, construction robots, and prototype development.
  works_zh:
    - 工程质量智能检测机器人
    - 现场安全智能巡检机器人
    - 建筑机器人机械本体方案设计
    - 传动与执行机构开发
    - 零部件选型与三维建模
    - 工程图纸输出
    - 样机外协加工管控
    - 样机装配调试
    - 结构仿真分析
    - 机械系统迭代优化
    - 科研成果转化
    - 智能化装备机电集成
  works_en:
    - Intelligent robots for construction-quality inspection
    - On-site safety inspection robots
    - Mechanical schemes for construction-robot bodies
    - Drive and actuator development
    - Component selection and 3D modeling
    - Engineering drawing output
    - Prototype outsourcing and fabrication control
    - Prototype assembly and commissioning
    - Structural simulation
    - Iterative mechanical-system optimization
    - Research-to-product transfer
    - Electromechanical integration of intelligent equipment

