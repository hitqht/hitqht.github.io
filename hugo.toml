baseURL = "https://hitqht.github.io/"
title = "齐宏拓课题组"
enableRobotsTXT = true
enableGitInfo = true
canonifyURLs = false
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
summaryLength = 80
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 20

[params]
  email = "hitqht@163.com"
  authorZh = "齐宏拓"
  authorEn = "Qi Hongtuo"
  orcid = ""          # 例如 0000-0002-xxxx-xxxx，填了会写入 Person/sameAs
  scholar = ""        # Google Scholar 主页完整 URL
  researchgate = ""   # ResearchGate 主页完整 URL（可选）
  scopus = ""         # Scopus 作者主页完整 URL（可选）
  # 以上四项任填一项，主页简介与页脚就会出现对应的学术主页链接
  portrait = "media/misc/qihongtuo.jpg"
  portraitFallback = "media/misc/_portrait.svg"
  teamPlaceholder = "media/team/_placeholder.svg"
  figurePlaceholder = "media/blog/_figure.svg"

# 让 static/media 下的图片也能被 Hugo 处理（自动压缩为 WebP、生成多种尺寸）。
# 照片仍然照常放进 static/media/，无需改动维护方式。
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "static/media"
  target = "assets/media"

[imaging]
  quality = 78
  resampleFilter = "Lanczos"

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true

[languages.zh]
  locale = "zh-CN"
  label = "中文"
  contentDir = "content/zh"
  weight = 1
  title = "齐宏拓课题组"
  [languages.zh.params]
    seoTitle = "齐宏拓｜重庆大学 · 智能建造"
    brand = "齐宏拓课题组"
    tagline = "智能建造 · Intelligent Construction  |  重庆大学土木工程学院"
    affiliation = "重庆大学土木工程学院"
    description = "齐宏拓，重庆大学土木工程学院特聘研究员：装配式建筑、智能设计、智能检测、建造机器人、建造领域垂类大模型。"
    keywords = ["装配式建筑", "垂类大模型", "智能设计", "智能检测", "建造机器人"]

[languages.en]
  locale = "en"
  label = "English"
  contentDir = "content/en"
  weight = 2
  title = "Qi Hongtuo Lab"
  [languages.en.params]
    seoTitle = "Qi Hongtuo | Intelligent Construction, Chongqing University"
    brand = "Qi Hongtuo Lab"
    tagline = "Intelligent Construction  |  School of Civil Engineering, Chongqing University"
    affiliation = "School of Civil Engineering, Chongqing University"
    description = "Qi Hongtuo, Distinguished Research Fellow at Chongqing University: prefabricated construction, intelligent design, intelligent inspection, construction robotics, and domain-specific LLMs for construction."
    keywords = ["Prefabrication", "Domain LLM", "Intelligent design", "Inspection", "Robotics"]

